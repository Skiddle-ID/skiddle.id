name = "skiddle-id"

compatibility_date = "2025-07-18"
compatibility_flags = [ "nodejs_compat" ]

[[routes]]
pattern = "skiddle.id"
custom_domain = true

[[routes]]
pattern = "skiddle.blue"
custom_domain = true

[vars]
ATP_IDENTIFIER = "skiddle.blue"
ATP_SERVICE = "https://rhizopogon.us-west.host.bsky.network/"
LASTFM_USERNAME = "arcestia"
# LASTFM_API_KEY is a secret, not a var: set it with `npx wrangler secret put LASTFM_API_KEY` (local dev: .dev.vars)

[observability]
enabled = true

[assets]
binding = "ASSETS"
directory = "./dist"

[[kv_namespaces]]
binding = "CACHE"
id = "da6e604bb2a44825ae5d4c26503dd112"
