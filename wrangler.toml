name = "skiddle-id"

compatibility_date = "2025-07-18"
compatibility_flags = [ "nodejs_compat" ]

# Production is only served on the custom domains below, not on *.workers.dev
workers_dev = false
# Keep Preview URLs on for PR preview builds (https://<branch>-skiddle-id.skiddle.workers.dev).
# Unset, they default to workers_dev, so every production deploy switched them off again.
preview_urls = true

[[routes]]
pattern = "skiddle.id"
custom_domain = true

[[routes]]
pattern = "skiddle.blue"
custom_domain = true

[vars]
LASTFM_USERNAME = "arcestia"
# LASTFM_API_KEY is a secret, not a var: set it with `npx wrangler secret put LASTFM_API_KEY` (local dev: .dev.vars)
# Worker Previews (builds of PR branches) don't inherit vars or secrets from production. The Last.fm
# key is deliberately not given to previews, so the Now Playing card there shows "nothing playing".

[observability]
enabled = true

[assets]
binding = "ASSETS"
directory = "./dist"
