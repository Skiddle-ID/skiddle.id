name = "skiddle-id"

compatibility_date = "2025-07-18"
compatibility_flags = [ "nodejs_compat" ]

# Production is only served on the custom domains below, not on *.workers.dev
workers_dev = false
# Keep Preview URLs on for PR preview builds (https://<branch>-skiddle-id.skiddle.workers.dev).
# Unset, they default to workers_dev, so every production deploy switched them off again.
preview_urls = true

[[routes]]
pattern = "skiddle.id"
custom_domain = true

[[routes]]
pattern = "skiddle.blue"
custom_domain = true

# skiddle-covers (workers/covers): runs Deezer's search for album art near Singapore, where Deezer
# is open; it isn't in Hong Kong, where this Worker often runs (src/lib/music.ts)
[[services]]
binding = "COVERS"
service = "skiddle-covers"

[observability]
enabled = true

[assets]
binding = "ASSETS"
directory = "./dist"
