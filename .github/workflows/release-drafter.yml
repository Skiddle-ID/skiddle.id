name: Release Drafter

on:
  push:
    branches: [v3]
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled]
  workflow_dispatch:

# contents: write to create/update the draft release; pull-requests: write for the autolabeler
permissions:
  contents: write
  pull-requests: write

jobs:
  update_release_draft:
    runs-on: ubuntu-latest
    if: github.repository == 'Skiddle-ID/skiddle.id'
    steps:
      - uses: release-drafter/release-drafter@v6
        with:
          config-name: release-drafter.yml
          # PRs: only label them (a draft can't target a PR's merge ref). Pushes to v3: update the draft.
          disable-releaser: ${{ github.event_name == 'pull_request' }}
          disable-autolabeler: ${{ github.event_name != 'pull_request' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
