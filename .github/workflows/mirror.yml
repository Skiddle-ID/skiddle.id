name: Mirror to Tangled
on: 
  push:
  delete:
  workflow_dispatch: # This adds a "Run workflow" button in the UI

# Only reads the repo; the push to Tangled uses its own SSH key (TANGLED_SSH)
permissions:
  contents: read

jobs:
  codeberg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pixta-dev/repository-mirroring-action@v1
        with:
          target_repo_url: git@tangled.org:skiddle.blue/skiddle.id
          ssh_private_key: ${{ secrets.TANGLED_SSH }}
