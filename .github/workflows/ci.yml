name: CI

# Lints every PR (and v4 after merges), checks the lexicons and runs the unit tests. The
# build itself is checked by Cloudflare's preview build ("Workers Builds: skiddle-id").
on:
  pull_request:
  push:
    branches: [v4]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      - run: npm run lint

      # The lexicons in lexicons/ are valid lexicon documents
      - run: npm run check:lexicons

      # The scheduler that publishes scheduled posts (workers/publisher)
      - run: npm run test:unit
