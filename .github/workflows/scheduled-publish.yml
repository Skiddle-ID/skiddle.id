name: Publish scheduled posts

# Every hour, publishes posts whose `publishAt` time has passed (scripts/publish-scheduled.mjs),
# commits that to v3 (Cloudflare deploys it), then starts "Announce posts on Bluesky" for them,
# which waits until they're live, posts them and turns comments on. The AT Protocol records follow
# as usual. Pushes made with GITHUB_TOKEN don't start other workflows, but workflow_dispatch can.
# GitHub can start scheduled runs a few minutes late.
on:
  schedule:
    - cron: '5 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run: show what would be published, change nothing'
        required: false
        type: boolean
        default: true

permissions:
  contents: write
  actions: write

concurrency:
  group: scheduled-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'Skiddle-ID/skiddle.id'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: v3

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          # Only Node's built-in modules (no npm ci); no cache, as this job can push to v3
          package-manager-cache: false

      - name: Publish posts that are due
        id: due
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: node scripts/publish-scheduled.mjs

      - name: Commit and push
        if: steps.due.outputs.slugs != ''
        env:
          TITLES: ${{ steps.due.outputs.titles }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/content/posts
          git commit -m "post: publish $TITLES (scheduled)"
          git pull --rebase origin v3
          git push origin HEAD:v3

      - name: Announce on Bluesky
        if: steps.due.outputs.slugs != ''
        env:
          GH_TOKEN: ${{ github.token }}
          SLUGS: ${{ steps.due.outputs.slugs }}
        run: gh workflow run bluesky-announce.yml --ref v3 -f slug="$SLUGS" -f dry_run=false
